name = "pollaris-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

[vars]
REPO_OWNER = "pollsof"
REPO_NAME = "releases"
VALID_PRODUCTS = "green,snack"
BOT_USERNAME = "PollarisReleasesBot"
MERGE_REPO_green = "pollsof/green"
MERGE_REPO_snack = "pollsof/snack"
MERGE_METHOD = "merge"

[[kv_namespaces]]
binding = "POLLARIS_KV"
id = "6381faa16dfa4e77bca33eb83df01741"

# Secrets (nao commitar): wrangler secret put TELEGRAM_BOT_TOKEN
#   TELEGRAM_BOT_TOKEN, GITHUB_TOKEN, ROOT_ID, ALLOWED_USERS, PAGES_NOTIFY_SECRET
# GITHUB_TOKEN precisa de pull_requests:write nos repos MERGE_REPO_*
