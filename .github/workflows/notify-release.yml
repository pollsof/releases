name: Notificar release no Telegram

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release para simular notificacao (ex: green-v3.0.0.122)'
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Montar mensagem
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG_INPUT: ${{ github.event.release.tag_name || inputs.release_tag }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { join } = await import('node:path');
            const formatterPath = pathToFileURL(
              join(process.env.GITHUB_WORKSPACE, '.github/scripts/format-release-telegram.mjs')
            ).href;
            const { formatReleaseTelegramMessage } = await import(formatterPath);

            const releaseTag = process.env.RELEASE_TAG_INPUT;
            if (!releaseTag) {
              core.setFailed('Nao foi possivel resolver a tag da release.');
              return;
            }

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: releaseTag,
            });

            if (!release.assets?.length && release.id) {
              const { data: fullRelease } = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              release.assets = fullRelease.assets;
            }

            const message = formatReleaseTelegramMessage(release);
            if (!message.trim()) {
              core.setFailed(`Mensagem vazia para a release ${releaseTag}.`);
              return;
            }

            core.setOutput('message', message);
            core.setOutput('release_tag', releaseTag);
            core.info(`Notificando release ${releaseTag}`);

      - name: Enviar notificacao Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ steps.release.outputs.message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN ou TELEGRAM_CHAT_ID nao configurado."
            exit 1
          fi

          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}' \
          | curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d @-
