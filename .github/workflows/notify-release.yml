name: Notificar release no Telegram

on:
  deployment_status:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release para simular notificacao (ex: green-v3.0.0.122)'
        required: true

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'github-pages'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver release e montar mensagem
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG_INPUT: ${{ github.event.release.tag_name || inputs.release_tag }}
        with:
          script: |
            const {
              resolveReleaseTagFromCommitMessage,
              shouldNotifyOnReleaseEvent,
              formatReleaseTelegramMessage,
            } = await import('./.github/scripts/format-release-telegram.mjs');

            let releaseTag = null;

            if (context.eventName === 'workflow_dispatch') {
              releaseTag = process.env.RELEASE_TAG_INPUT;
            } else if (context.eventName === 'release') {
              releaseTag = context.payload.release.tag_name;
              if (!shouldNotifyOnReleaseEvent(releaseTag)) {
                core.info(`Release ${releaseTag} sera notificada apos deploy do GitHub Pages.`);
                return;
              }
            } else if (context.eventName === 'deployment_status') {
              const { data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.deployment.sha,
              });

              releaseTag = resolveReleaseTagFromCommitMessage(commit.commit.message);
              if (!releaseTag) {
                core.info('Commit do deploy nao corresponde a uma nova release. Notificacao ignorada.');
                core.info(commit.commit.message.split('\n')[0]);
                return;
              }
            }

            if (!releaseTag) {
              core.setFailed('Nao foi possivel resolver a tag da release.');
              return;
            }

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: releaseTag,
            });

            if (!release.assets?.length && release.id) {
              const { data: fullRelease } = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              release.assets = fullRelease.assets;
            }

            const message = formatReleaseTelegramMessage(release);
            core.setOutput('message', message);
            core.setOutput('release_tag', releaseTag);
            core.info(`Notificando release ${releaseTag}`);

      - name: Enviar notificacao Telegram
        if: steps.release.outputs.message != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ steps.release.outputs.message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN ou TELEGRAM_CHAT_ID nao configurado."
            exit 0
          fi

          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}' \
          | curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d @-
